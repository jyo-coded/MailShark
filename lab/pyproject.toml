[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailshark-lab"
version = "1.0.0"
description = "MailShark Lab: phishing campaign tracing for email forensics (acquisition → analysis → validation → report)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jyothir" }]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "networkx>=3.2",
  "datasketch>=1.6",
  "tldextract>=5.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "ppdeep>=20200505",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mailshark-lab = "mailshark_lab.cli:main"

[tool.setuptools]
packages = ["mailshark_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
